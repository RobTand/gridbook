[build-system]
# >=77 is the real floor: `license = "Apache-2.0"` is a PEP 639 SPDX
# expression, which setuptools only emits (Metadata-Version 2.4) from 77.0.0.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gridbook"
dynamic = ["version"]          # single source of truth: gridbook.__version__
# Bit-rate range is the union of the two format families' rung ladders, quoted
# from the PrismaQuant producer project's kernel standard (STANDARDS.md) — a
# SEPARATE repository, not a path in this one, and not verifiable from here.
# NVFP4_CB's public K1-K25 domain spans 0.625-3.625 bpw in v1 and
# 0.40625-3.40625 bpw in v2. Direct K26-K32 CUDA templates are research-only
# and do not enlarge the format. The v11
# FP8_CB producer menu K4-K48/4 spans 0.5-6.0 body bpw. The in-repo normative
# formulas are docs/SPEC.md §1.4. The
# published artifacts sit at 2.9 / 5.5 / 6 bit, so "sub-4-bit" would be wrong
# for most of the family.
description = "vLLM plugin for the NVFP4-CB / FP8-CB product-codebook weight formats: 0.5-6 body-bit-per-weight LLM quantization served by dedicated CUDA decode and prefill kernels."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Robert Tand", email = "robert.tand@icloud.com" }]
keywords = [
    "vllm",
    "quantization",
    "llm",
    "inference",
    "cuda",
    "nvfp4",
    "fp8",
    "codebook",
    "vector-quantization",
    "blackwell",
]
classifiers = [
    # NOTE: no `License ::` classifier — PEP 639 deprecates it alongside the
    # SPDX `license` expression above, and setuptools>=77 rejects both together.
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    # 3.13 measured end-to-end 2026-07-28 (clean python:3.13-slim container,
    # installed wheel, torch 2.13.0+cpu: 156 passed / 136 skipped / 0 failed).
    # 3.14 stays out until torch ships supported wheels for it.
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Unpinned on purpose. gridbook is installed *into an environment that already
# has vLLM*, whose torch is typically a local-version wheel
# (e.g. 2.11.0+cu130) that no pin from PyPI can satisfy. huggingface-hub is a
# direct import (config.py, linear.py) and was previously relied on
# transitively via vLLM.
dependencies = ["torch", "safetensors", "huggingface-hub"]

[project.optional-dependencies]
# vLLM is NOT a hard dependency: it is multi-GB, the reference serving builds
# are source/nightly builds that are not on PyPI, and `import gridbook` (codec
# + kernel tests) deliberately works without it — only `register()` needs it.
serve = ["vllm"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/RobTand/gridbook"
Repository = "https://github.com/RobTand/gridbook"
Issues = "https://github.com/RobTand/gridbook/issues"
Documentation = "https://github.com/RobTand/gridbook/blob/master/docs/SPEC.md"

[project.entry-points."vllm.general_plugins"]
gridbook = "gridbook:register"

[project.scripts]
gridbook-bench-serve = "gridbook.bench_serve:main"

[tool.setuptools.dynamic]
version = { attr = "gridbook.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["gridbook*"]

# The CUDA/CUTLASS sources are JIT-compiled at first use by
# torch.utils.cpp_extension.load, so they must be present in *any* install,
# including a non-editable wheel. They live under gridbook/csrc (inside the
# package) precisely so this glob can reach them; package-data also lands in
# the sdist automatically. Do not move csrc back to the repo root.
#
# These globs are single-level ON PURPOSE. `csrc/tools/` holds standalone
# main() developer binaries (a smem-budget probe and a toolchain probe) that
# no runtime path loads: they belong in the repo and the sdist, not in every
# user's site-packages. A `csrc/**/*.cu` recursive glob would silently ship
# them again -- MANIFEST.in re-adds that directory to the sdist alone, and
# .github/scripts/check_dist.py asserts the split in both directions.
[tool.setuptools.package-data]
gridbook = [
    "runtime_contract.json",
    "csrc/*.cu",
    "csrc/*.cuh",
    "csrc/*.h",
    # csrc/*.hpp — added 2026-08-02. `cb_grouped_common.hpp` (the shared EVT
    # trees, smem gate and grouped host validation, extracted by the 2026-08-01
    # audit §4 dedupe) is the first top-level .hpp under csrc/, and NO glob here
    # matched it: `.h` does not match `.hpp`, and `cutlass_fork/*.hpp` is a
    # different directory. It is a declared build input of all four
    # fused/grouped loaders, so an installed wheel could not JIT-build ANY of
    # them (`_require_csrc` raises IncompleteInstallError). Single-level like
    # its siblings, so csrc/tools/ stays wheel-excluded.
    "csrc/*.hpp",
    "csrc/cutlass_fork/*.hpp",
]

# ...and the wheel-side subtraction. `include-package-data` defaults to TRUE
# under a pyproject.toml config, so every MANIFEST.in rule that names a file
# INSIDE the package would otherwise put it in the wheel as well as the sdist.
# These entries are what make "sdist yes, wheel no" hold; they are asserted in
# both directions by .github/scripts/check_dist.py, which fails if any of them
# reaches the wheel or goes missing from the sdist.
#
# BOTH keys are load-bearing, and the reason is not obvious. `packages.find`
# defaults to namespaces = true, so setuptools treats `gridbook/csrc/tools`
# as its own (namespace) package: a MANIFEST.in file under it is attributed to
# the package `gridbook.csrc.tools`, while the same file reached through the
# `gridbook` package-data globs is attributed to `gridbook`. An exclusion only
# filters the attribution it names, so a single key silently half-works.
[tool.setuptools.exclude-package-data]
gridbook = [
    "csrc/tools/*",
    "csrc/cutlass_fork/*_orig.hpp",
]
"gridbook.csrc.tools" = ["*"]
"gridbook.csrc.cutlass_fork" = ["*_orig.hpp"]
